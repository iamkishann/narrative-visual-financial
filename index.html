<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dot-Com Decade — a Narrative Visualization</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="scene-header">
      <h1 id="scene-title">Loading…</h1>
      <p id="scene-message"></p>
    </header>

    <div id="chart-container">
      <svg id="chart"></svg>
      <div id="tooltip" class="hidden"></div>
      <p id="hover-hint">Hover any point on the chart for the exact monthly price.</p>
    </div>

    <nav id="controls" aria-label="Scene navigation"></nav>

    <footer id="scene-footer">
      <p>Data: monthly closing prices, Jan 2000–Mar 2010, AAPL / AMZN / GOOG / IBM / MSFT
      (source: <code>vega-datasets/stocks.csv</code>).</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-svg-annotation@2.5.1/d3-annotation.min.js"></script>
  <script src="data.js"></script>
  <script src="annotations.js"></script>
  <script src="scenes.js"></script>
  <script src="main.js"></script>
</body>
</html>
